<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muro del grupo</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .tarjeta-nota {
      width: 17rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .tarjeta-nota:hover {
      transform: rotate(0deg) scale(1.05) !important;
      box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15) !important;
      z-index: 10;
    }
    .texto-recado {
      font-family: "Arial Black", Gadget, sans-serif;
    }
  </style>
</head>
<body class="bg-light min-vh-100 py-5">

  <div class="container">
    
    <header class="text-center mb-5">
      <h1 class="display-4 fw-bold text-dark mb-1">Muro del grupo</h1>
      <p class="fs-4 fw-semibold text-warning">Recados de la clase</p>
    </header>

   
    <div class="d-flex flex-wrap justify-content-center gap-4 mb-5">

      <div class="card tarjeta-nota bg-success-subtle border-0 border-top border-success border-4 rounded-4 shadow p-3" style="transform: rotate(-3deg);">
        <div class="card-body">
          <b class="d-block text-uppercase text-success-emphasis small mb-2">Uriel:</b>
          <span class="texto-recado fs-5 text-dark">Son las tres de la mañana</span>
        </div>
      </div>

      <div class="card tarjeta-nota bg-warning-subtle border-0 border-top border-warning border-4 rounded-4 shadow p-3" style="transform: rotate(2deg);">
        <div class="card-body">
          <b class="d-block text-uppercase text-warning-emphasis small mb-2">Luis:</b>
          <span class="texto-recado fs-5 text-dark">Y estoy en tu ventanar</span>
        </div>
      </div>

      <div class="card tarjeta-nota bg-info-subtle border-0 border-top border-info border-4 rounded-4 shadow p-3" style="transform: rotate(-2deg);">
        <div class="card-body">
          <b class="d-block text-uppercase text-info-emphasis small mb-2">Dante:</b>
          <span class="texto-recado fs-5 text-dark">Buscandote amor, responde por favor</span>
        </div>
      </div>

    </div>

    <div class="text-center">
      <button class="btn btn-warning text-white fw-bold fs-5 px-5 py-2 rounded-pill shadow">
        Publicar recado
      </button>
    </div>
  </div>

</body>
</html>
